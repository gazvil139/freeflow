name: Build FreeFlow APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Setup Android NDK
      run: sdkmanager "ndk;28.0.13004108"
    
    - name: Build libbox from source
      run: |
        git clone --depth 1 -b v1.11.1 https://github.com/SagerNet/sing-box.git sing-box-src
        cd sing-box-src
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        gomobile bind -v -androidapi 21 -javapkg=io.nekohasekai -libname=box -tags='with_gvisor,with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_reality_server,with_acme,with_clash_api' ./experimental/libbox
        mkdir -p ../app/libs
        cp libbox.aar ../app/libs/libbox.aar
        cp libbox.aar ../app/libs/libbox-legacy.aar
        ls -la ../app/libs/
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleOtherLegacyRelease --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FreeFlow-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30
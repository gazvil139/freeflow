name: Build FreeFlow APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Download libbox
      run: |
        mkdir -p app/libs
        LIBBOX_URL=$(curl -s https://api.github.com/repos/sagernet/sing-box/releases/latest | grep -o 'https://[^"]*libbox[^"]*\.aar\.gz' | head -1)
        if [ -z "$LIBBOX_URL" ]; then
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.11.1/libbox-1.11.1.aar.gz" -o libbox.aar.gz
        else
          curl -sL "$LIBBOX_URL" -o libbox.aar.gz
        fi
        gunzip libbox.aar.gz || mv libbox.aar.gz libbox.aar
        mv libbox.aar app/libs/
        ls -la app/libs/
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FreeFlow-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30
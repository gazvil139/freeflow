name: Build FreeFlow APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Download libbox
      run: |
        mkdir -p app/libs
        # Download from singbox-android/libbox releases
        curl -sL "https://github.com/singbox-android/libbox/releases/download/v1.13.3/libbox-1.13.3.zip" -o libbox.zip
        unzip -o libbox.zip -d libbox-tmp
        cp libbox-tmp/libbox-*/libbox.aar app/libs/libbox.aar || cp libbox-tmp/libbox.aar app/libs/libbox.aar || find libbox-tmp -name "*.aar" -exec cp {} app/libs/libbox.aar \;
        cp app/libs/libbox.aar app/libs/libbox-legacy.aar
        ls -la app/libs/
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleOtherLegacyRelease --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FreeFlow-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30